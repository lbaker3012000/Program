<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Block 2</title>
<style>
:root{
  --bg:#0d0d0f;--bg2:#17171a;--bg3:#202024;--bg4:#2a2a2f;
  --border:#2c2c32;--border2:#3a3a42;
  --text:#f0f0f3;--text2:#8e8e9e;--text3:#4a4a58;
  --blue:#5b9ef9;--blue-bg:#0c1e3a;--blue-dim:#0f2040;--blue-text:#8bbfff;
  --green-bg:#0f2210;--green-text:#7ed081;
  --amber-bg:#291c03;--amber-text:#fbbf24;
  --red-bg:#280c0c;--red-text:#f87171;
  --pink-bg:#220d1a;--pink-text:#f0a0c8;
  --gray-bg:#202024;--gray-text:#7878a0;
  --teal-bg:#081e18;--teal-text:#4ecfa0;
  --purple-bg:#1a1030;--purple-text:#c084fc;
  --r:14px;--rsm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
body{padding:0 0 120px}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 18px 14px;position:sticky;top:0;z-index:100}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.sub{font-size:13px;color:var(--text2);margin-top:3px}
.pill{display:inline-block;background:var(--green-bg);color:var(--green-text);font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;margin-top:8px}
.hdr-r{text-align:right;flex-shrink:0}
.hr-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px}
.hr-val{font-size:22px;font-weight:800;color:var(--green-text);letter-spacing:-0.5px}
.hr-sub{font-size:11px;color:var(--text2);margin-top:1px}
.nav{display:flex;gap:8px;padding:14px 18px 0}
.navbtn{flex:1;font-size:14px;padding:9px 0;border-radius:24px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-weight:600;cursor:pointer;transition:all .15s}
.navbtn.act{background:var(--blue-dim);color:var(--blue-text);border-color:var(--blue)}
.tmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 18px}
.tmc{background:var(--bg2);border-radius:var(--rsm);padding:13px 14px;border:1px solid var(--border)}
.tml{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;font-weight:600}
.tmv{font-size:24px;font-weight:800;letter-spacing:-0.6px}
.tmu{font-size:13px;color:var(--text2);margin-left:2px;font-weight:400}
.slbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.7px;font-weight:700;padding:0 18px 8px}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 18px 20px}
.sday{border-radius:var(--rsm);padding:9px 4px;text-align:center}
.sdd{font-size:10px;font-weight:700;margin-bottom:4px;opacity:.75}
.sdn{font-size:11px;font-weight:700;line-height:1.3}
.sds{font-size:9px;margin-top:3px;opacity:.6;line-height:1.3}
.wwrap{padding:0 18px;margin-bottom:12px}
.wscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wscroll::-webkit-scrollbar{display:none}
.wcard{flex-shrink:0;width:104px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:11px 12px;cursor:pointer;transition:all .15s}
.wcard.sel{border-color:var(--blue);background:var(--blue-dim)}
.wcard.dl{opacity:.6}
.wcard.dl.sel{opacity:1;border-color:var(--amber-text);background:var(--amber-bg)}
.wn{font-size:11px;color:var(--text3);font-weight:700}
.wt{font-size:15px;font-weight:800;margin-top:3px;letter-spacing:-0.3px}
.wr{font-size:11px;color:var(--text2);margin-top:3px}
.sarea{padding:0 18px}
.dtabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;font-size:14px;padding:9px 16px;border-radius:24px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:600;transition:all .15s}
.dtab.act{background:var(--blue-dim);color:var(--blue-text);border-color:var(--blue)}
.scard{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.shead{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--border)}
.sic{width:42px;height:42px;border-radius:var(--rsm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.sname{font-size:16px;font-weight:800;letter-spacing:-0.3px}
.ssub{font-size:12px;color:var(--text2);margin-top:3px}
.exrow{padding:15px 17px;border-bottom:1px solid var(--border)}
.exrow:last-child{border-bottom:none}
.extop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px}
.exname{font-size:15px;font-weight:700;line-height:1.3;flex:1;letter-spacing:-0.1px}
.extags{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.tc{background:var(--blue-bg);color:var(--blue-text)}
.tv{background:var(--pink-bg);color:var(--pink-text)}
.ta{background:var(--gray-bg);color:var(--gray-text)}
.tb{background:var(--purple-bg);color:var(--purple-text)}
.tr{background:var(--teal-bg);color:var(--teal-text)}
.rp{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.rlo{background:var(--green-bg);color:var(--green-text)}
.rmd{background:var(--amber-bg);color:var(--amber-text)}
.rhi{background:var(--red-bg);color:var(--red-text)}
.exdet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.exd{background:var(--bg3);border-radius:var(--rsm);padding:11px 12px}
.exdl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;font-weight:700}
.exdv{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-0.4px}
.exdv.big{color:var(--blue-text)}
.exnote{font-size:13px;color:var(--text2);line-height:1.65}
.pnote{background:var(--bg3);padding:13px 16px;font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px;border-left:3px solid var(--blue);border-radius:0 var(--rsm) var(--rsm) 0}
.pnote.warn{border-left-color:var(--amber-text)}
.ncard{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.nhead{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.nic{width:34px;height:34px;border-radius:var(--rsm);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.ntitle{font-size:15px;font-weight:800;letter-spacing:-0.2px}
.nbody{padding:6px 17px 14px}
.nitem{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text2);line-height:1.65}
.nitem:last-child{border-bottom:none}
.nitem strong{color:var(--text);font-weight:700}
.dlcard{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);padding:22px 18px;margin-bottom:14px}
.dltitle{font-size:19px;font-weight:800;margin-bottom:8px;letter-spacing:-0.4px}
.dlsub{font-size:14px;color:var(--text2);margin-bottom:18px;line-height:1.6}
.dltbl{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px}
.dltbl th{text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:0 8px 8px 0;font-weight:700;border-bottom:1px solid var(--border)}
.dltbl td{padding:10px 8px 10px 0;border-bottom:1px solid var(--border)}
.dltbl tr:last-child td{border-bottom:none}
.dltbl .ld{font-weight:800;color:var(--blue-text)}
.dllist{list-style:none}
.dllist li{padding:9px 0;font-size:14px;border-bottom:1px solid var(--border);color:var(--text2);line-height:1.6}
.dllist li:last-child{border-bottom:none}
.dllist strong{color:var(--text);font-weight:700}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="title">Block 2</div>
      <div class="sub">Mass phase · small surplus · 4 weeks + deload</div>
      <div class="pill" id="pill">90kg · building</div>
    </div>
    <div class="hdr-r">
      <div class="hr-lbl">Sets/week</div>
      <div class="hr-val" id="setcount">18</div>
      <div class="hr-sub">per muscle group</div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="navbtn act" id="nav0" onclick="setView(0)">Program</button>
  <button class="navbtn" id="nav1" onclick="setView(1)">Notes</button>
</div>

<div id="view0">
<div class="tmgrid">
  <div class="tmc"><div class="tml">Squat TM</div><div class="tmv">245<span class="tmu">kg</span></div></div>
  <div class="tmc"><div class="tml">Bench TM</div><div class="tmv">185<span class="tmu">kg</span></div></div>
  <div class="tmc"><div class="tml">Deadlift TM</div><div class="tmv">270<span class="tmu">kg</span></div></div>
</div>

<div class="slbl">Weekly schedule</div>
<div class="sched" id="sched"></div>

<div class="slbl">Week</div>
<div class="wwrap"><div class="wscroll" id="weeks"></div></div>

<div class="sarea" id="main"></div>
</div>

<div id="view1" style="display:none">
<div class="sarea" style="padding-top:16px" id="notes"></div>
</div>

<script>
const SCHED=[
  {d:'Mon',n:'Day 1',s:'Squat hvy',bg:'#0c1e3a',tc:'#8bbfff'},
  {d:'Tue',n:'Day 2',s:'Bench hvy',bg:'#0f2210',tc:'#7ed081'},
  {d:'Wed',n:'Rest',s:'Recovery',bg:'#17171a',tc:'#4a4a58'},
  {d:'Thu',n:'Day 3',s:'Deadlift',bg:'#291c03',tc:'#fbbf24'},
  {d:'Fri',n:'Day 4',s:'Squat vol',bg:'#220d1a',tc:'#f0a0c8'},
  {d:'Sat',n:'Day 5',s:'Bench vol',bg:'#1a1a1e',tc:'#7878a0'},
  {d:'Sun',n:'Rest',s:'Recovery',bg:'#17171a',tc:'#4a4a58'}
];
document.getElementById('sched').innerHTML=SCHED.map(s=>
  `<div class="sday" style="background:${s.bg}"><div class="sdd" style="color:${s.tc}">${s.d}</div><div class="sdn" style="color:${s.tc}">${s.n}</div><div class="sds" style="color:${s.tc}">${s.s}</div></div>`).join('');

// Block 2 — 4 weeks. Loads carry forward from Block 1 weeks 5-6.
const SQH=[200,205,207.5,210];
const SQV=[172.5,175,177.5,180];
const BPH=[150,152.5,155,157.5];
const BPV=[125,127.5,130,132.5];
const DLH=[215,220,225,230];
const DLT=[182.5,185,187.5,190];
const MRPE=[7.5,8,8,8.5];
const ASETS=[4,4,4,4];
const SETCOUNT=[18,18,18,18];

const WEEKS=[
  {lbl:'Deload',n:'Now',t:'dl',sub:'This week',cur:1},
  {lbl:'Week',n:'1',t:'w',i:0},
  {lbl:'Week',n:'2',t:'w',i:1},
  {lbl:'Week',n:'3',t:'w',i:2},
  {lbl:'Week',n:'4',t:'w',i:3},
  {lbl:'Deload',n:'End',t:'dl2',sub:'Planned'}
];

const DAYS=[
  {n:'Day 1',name:'Squat heavy · quads · arms',ic:'S1',bg:'#0c1e3a',tc:'#8bbfff'},
  {n:'Day 2',name:'Bench heavy · overhead · delts',ic:'B1',bg:'#0f2210',tc:'#7ed081'},
  {n:'Day 3',name:'Deadlift heavy · posterior · back',ic:'D1',bg:'#291c03',tc:'#fbbf24'},
  {n:'Day 4',name:'Squat volume · hacks · arms',ic:'S2',bg:'#220d1a',tc:'#f0a0c8'},
  {n:'Day 5',name:'Bench volume · DL technique',ic:'B2',bg:'#1a1a1e',tc:'#7878a0'}
];

function rc(r){if(r>=9)return'rhi';if(r>=8)return'rmd';return'rlo'}

function sess(w,d){
  const a=ASETS[w],r=MRPE[w];
  const S=[
    [
      {n:'Competition squat',t:'c',s:4,rp:5,l:SQH[w]+'kg',rpe:r,note:'3–4 min rest. Load progresses weekly, reps stay fixed. Bar speed crisp on every set.'},
      {n:'Leg extension',t:'a',s:a,rp:'10–15',l:'RPE 8–9',rpe:8.5,note:'Main quad isolation. Full range, controlled — do not slam into lockout. Hits rectus femoris, which stays short in every squat pattern and gets nothing from the barbell work.'},
      {n:'Leg curl',t:'a',s:a,rp:'10–12',l:'RPE 8',rpe:8,note:'3s eccentric.'},
      {n:'EZ-bar curl',t:'b',s:a,rp:'8–10',l:'RPE 8–9',rpe:8.5,note:'Heaviest curl of the week. Strict.'},
      {n:'Incline DB curl',t:'b',s:a,rp:'10–12',l:'RPE 9',rpe:9,note:'Full stretch at the bottom. Near failure — costs nothing systemically.'},
      {n:'Ab wheel',t:'a',s:2,rp:'12–15',l:'BW',rpe:7,note:'Anti-extension.'}
    ],
    [
      {n:'Competition bench',t:'c',s:4,rp:5,l:BPH[w]+'kg',rpe:r,note:'Wide foot stance, drive out not down. If the erectors feel at all tight from Monday, flatten the arch off — do not push through it.'},
      {n:'Overhead press (barbell)',t:'v',s:a,rp:'6–8',l:'RPE 8',rpe:8,note:'Primary presser. Strict, no leg drive. Progress the load when 8 reps get easy.'},
      {n:'Chest-supported DB row',t:'a',s:a,rp:'10–12',l:'RPE 8',rpe:8,note:'Elbows 45°, pause at the top.'},
      {n:'Cable fly',t:'b',s:a,rp:'12–15',l:'RPE 9',rpe:9,note:'Deep stretch at the bottom. This is the chest hypertrophy work — comp bench never loads the stretched position.'},
      {n:'Lateral raise',t:'b',s:a,rp:'15–20',l:'RPE 9',rpe:9,note:'Slow, no swing. To failure.'},
      {n:'Face pulls',t:'r',s:3,rp:'15–20',l:'Light',rpe:7,note:'Rear delt and scap.'},
      {n:'Z-twist (Mansour)',t:'r',s:3,rp:'12–15',l:'Very light',rpe:6,note:'External rotation. Slow. Not a strength exercise.'},
      {n:'Skullcrusher',t:'a',s:a,rp:'10–12',l:'RPE 8',rpe:8,note:'Mid-range tricep.'}
    ],
    [
      {n:'Competition deadlift',t:'c',s:4,rp:5,l:DLH[w]+'kg',rpe:r,note:'First lift of the day, fresh. Dead stop every rep — lose tension, regather, pull.'},
      {n:'Romanian deadlift',t:'a',s:a,rp:'8–10',l:'RPE 8',rpe:8,note:'Full stretch, controlled.'},
      {n:'Lat pulldown',t:'a',s:a,rp:'10–12',l:'RPE 8',rpe:8,note:'Lats hold the bar in on a heavy pull.'},
      {n:'Barbell row',t:'a',s:a,rp:'8–10',l:'RPE 8',rpe:8,note:'Upper back thickness. Overhand, full retraction.'},
      {n:'45° back extension',t:'a',s:3,rp:'12–15',l:'BW / plate',rpe:7,note:'Erectors.'},
      {n:'Cable curl',t:'b',s:a,rp:'12–15',l:'RPE 9',rpe:9,note:'Constant tension. Squeeze at the top.'}
    ],
    [
      {n:'Competition squat — volume',t:'v',s:4,rp:8,l:SQV[w]+'kg',rpe:7,note:'Same groove, more reps. RPE 7 ceiling — builds tissue, does not test you.'},
      {n:'Leg extension',t:'a',s:a,rp:'15–20',l:'RPE 9',rpe:9,note:'Higher reps than Monday. Take these to failure — quad volume drives leg size and they cost nothing systemically.'},
      {n:'Leg curl',t:'a',s:a,rp:'12–15',l:'RPE 8–9',rpe:8.5,note:'Second hamstring hit.'},
      {n:'Lateral raise',t:'b',s:a,rp:'15–20',l:'RPE 9',rpe:9,note:'Second delt hit.'},
      {n:'Preacher / cable curl',t:'b',s:a,rp:'12',l:'RPE 9',rpe:9,note:'Third bicep session. Different angle to Monday.'},
      {n:'Standing calf raise',t:'b',s:3,rp:'12–15',l:'RPE 9',rpe:9,note:'Full stretch, 1s pause at top.'}
    ],
    [
      {n:'Competition bench — volume',t:'v',s:4,rp:8,l:BPV[w]+'kg',rpe:7,note:'Wide stance every rep. RPE 7 ceiling. Flatten the arch if the lower back is tight from Thursday.'},
      {n:'Deadlift — technique',t:'v',s:5,rp:3,l:DLT[w]+'kg',rpe:6,note:'RPE 6 CEILING — do not let this creep. Dead stop, full reset. Groove work, not a second heavy day.'},
      {n:'Incline DB press',t:'a',s:a,rp:'10–12',l:'RPE 8–9',rpe:8.5,note:'Upper chest. Dumbbells low, full range.'},
      {n:'Pec deck / DB fly',t:'b',s:a,rp:'12–15',l:'RPE 9',rpe:9,note:'Second chest stretch session. Slow eccentric, pause at stretch.'},
      {n:'Rear delt fly',t:'b',s:a,rp:'15–20',l:'RPE 9',rpe:9,note:'Second rear delt hit.'},
      {n:'Lateral raise',t:'b',s:3,rp:'15–20',l:'RPE 9',rpe:9,note:'Third delt hit.'},
      {n:'Tricep pushdown',t:'a',s:a,rp:'12–15',l:'RPE 8',rpe:8,note:'Lockout work.'},
      {n:'Hanging knee raise',t:'a',s:2,rp:'15',l:'BW',rpe:7,note:'Core flexion.'}
    ]
  ];
  return S[d];
}

const WNOTES=[
  'Week 1 — picking up where Block 1 left off, not resetting. The deload cleared the fatigue; the loads carry forward. Accessories stay at 4 sets all block — 18 sets per muscle group is where you went flat last time, so we ramp to it and hold rather than pushing past.',
  'Week 2 — top of Block 1\'s old progression. Squat 205 and a 220 pull should feel solid now you are fed and recovered.',
  'Week 3 — new territory. Beyond anything run in Block 1. Watch bar speed on the main lifts; that is the signal that matters.',
  'Week 4 — last hard week. Deload follows regardless of how you feel. If you sail through this, the next block runs longer. If fatigue bites here again, four weeks is genuinely your number and we plan around it.'
];

const NOTES=[
  {t:'What we learned in Block 1',ic:'1',bg:'#0c1e3a',tc:'#8bbfff',items:[
    '<strong>~18 sets per muscle group is the ceiling.</strong> Accessory energy dropped off at week 4 running 4 sets per exercise. Block 2 ramps to that number and holds rather than pushing to 5.',
    '<strong>Four hard weeks before fatigue shows.</strong> Same in a deficit (weeks 4–5 of Phase 1) and in a surplus. Two independent readings pointing at the same place.',
    '<strong>The erector cramp was sequencing, not volume.</strong> Heavy squats Monday leave the erectors fatigued; the bench arch then holds them contracted under load Tuesday. Not treated as a volume signal.',
    '<strong>Knees stayed clean through Block 1 and normalised during the deload.</strong> No leg press, no pause squats. Keep it that way. Leg extensions replace hack squats — take them controlled rather than slamming terminal extension.',
    '<strong>Block 2 is 4 weeks with a planned deload after,</strong> rather than ramping until something gives. If week 4 feels easy, the next block goes to 5 or 6.'
  ]},
  {t:'This week — deload',ic:'0',bg:'#291c03',tc:'#fbbf24',items:[
    '<strong>Three days: Mon, Wed, Fri.</strong> Squat 160kg 3×4 · Bench 122.5kg 3×4 · Deadlift 175kg 2×4. All RPE 5–6.',
    '<strong>Accessories: 2 sets each, one per pattern.</strong> Mon leg extension + leg curl. Wed chest-supported row + incline DB press. Fri lat pulldown + back extension.',
    '<strong>Cut entirely:</strong> all curls, laterals, flies, rear delts, calves, skullcrushers, pushdowns, overhead press. That is where the fatigue sits and you lose nothing in a week.',
    '<strong>Keep eating in the surplus.</strong> Do not drop calories because volume is down — the surplus is doing the recovery work.'
  ]},
  {t:'Deload signals',ic:'2',bg:'#291c03',tc:'#fbbf24',items:[
    '<strong>Bar speed on the main lifts.</strong> Most reliable signal. Same load moving slower than last week at the same RPE means fatigue is winning.',
    '<strong>Accessory energy dropping.</strong> This is what caught you in Block 1 — the main lifts still felt fine while the accessories went flat. Worth watching specifically.',
    '<strong>Knee ache returning.</strong> You know what that means now. Do not train through it twice.',
    '<strong>Sleep quality dropping or waking unrefreshed.</strong> Usually shows before performance does.',
    '<strong>Two bad sessions is noise. Four is a pattern.</strong>'
  ]},
  {t:'Nutrition',ic:'3',bg:'#0f2210',tc:'#7ed081',items:[
    '<strong>Surplus of roughly 250–300.</strong> Around 3,400–3,500 at 90kg with this training load.',
    '<strong>Carbs 450–480g.</strong> About 5.2g/kg. Protein 190g, fat 90g (do not go below 1g/kg fat to fit more carbs in).',
    '<strong>Target 0.25kg a week.</strong> Roughly 1kg a month. Faster than that as an advanced natural is mostly fat.',
    '<strong>Pre-training carbs low fibre, low fat.</strong> White rice, white potato, bagel. Save oats and wholegrain for morning and evening.',
    '<strong>If the scale has not moved in two weeks, add 150.</strong> Not more than that at once.'
  ]},
  {t:'Deadlift',ic:'4',bg:'#291c03',tc:'#fbbf24',items:[
    '<strong>Two sessions a week.</strong> Thursday heavy, Saturday light technique work.',
    '<strong>Saturday has a hard RPE 6 ceiling.</strong> If it creeps up it becomes a second heavy day, which is how you end up overreached.',
    '<strong>Dead stop on every rep, both sessions.</strong> Lose tension, regather, pull. Every rep a fresh floor break.',
    '<strong>Thursday is always first lift of the day.</strong> Nothing before it.',
    '<strong>Film a set every couple of weeks.</strong> Technique consistency is a goal of this phase and you cannot audit your own bar path from under it.'
  ]},
  {t:'Accessories',ic:'5',bg:'#1a1030',tc:'#c084fc',items:[
    '<strong>Biceps 3×, laterals 3×, chest flies 2×, rear delts 2×, calves 1×.</strong> Held at 4 sets all block.',
    '<strong>Take the physique work to failure.</strong> RPE 9 on curls, laterals and flies costs nothing systemically. Opposite of the barbell work.',
    '<strong>The flies are chest hypertrophy, not bench work.</strong> Comp bench is arched and tucked to move weight efficiently — it never loads the pec stretched. That is what the flies are for.',
    '<strong>Overhead press is the one to progress.</strong> Treat it like a main lift. Machine only as a substitute when short on time.',
    '<strong>SBD is always the priority.</strong> If a session runs long, cut accessories from the bottom up.'
  ]},
  {t:'After Block 2',ic:'→',bg:'#202024',tc:'#8888a0',items:[
    '<strong>Deload after week 4,</strong> same structure as this week.',
    '<strong>Then Block 3,</strong> loads carrying forward again. Length depends on how week 4 goes — 5 or 6 weeks if it felt comfortable, 4 again if fatigue bit.',
    '<strong>Mass phase runs to roughly 93kg</strong> at about 1kg a month. Expect 91kg by the end of this block.',
    '<strong>Test when it is worth testing.</strong> Fed, fresh, after a genuine peaking block — not at the end of a hard block and not after a cut.'
  ]}
];

let selW=1,selD=0,view=0;
try{const s=JSON.parse(localStorage.getItem('b2_v1'));if(s){if(s.w>=0&&s.w<6)selW=s.w;if(s.d>=0&&s.d<5)selD=s.d;if(s.v>=0&&s.v<2)view=s.v}}catch(e){}
function save(){try{localStorage.setItem('b2_v1',JSON.stringify({w:selW,d:selD,v:view}))}catch(e){}}

function setView(v){
  view=v;save();
  document.getElementById('nav0').className='navbtn'+(v===0?' act':'');
  document.getElementById('nav1').className='navbtn'+(v===1?' act':'');
  document.getElementById('view0').style.display=v===0?'block':'none';
  document.getElementById('view1').style.display=v===1?'block':'none';
  if(v===1)renderNotes();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderWeeks(){
  document.getElementById('weeks').innerHTML=WEEKS.map((w,i)=>
    `<div class="wcard${i===selW?' sel':''}${w.t!=='w'?' dl':''}" onclick="sw(${i})">
      <div class="wn">${w.lbl}</div>
      <div class="wt">${w.n}</div>
      <div class="wr">${w.t==='w'?ASETS[w.i]+' sets acc':w.sub}</div>
    </div>`).join('');
  const w=WEEKS[selW];
  document.getElementById('setcount').textContent=w.t==='w'?SETCOUNT[w.i]:'—';
}

function deloadHTML(planned){
  return `<div class="dlcard">
    <div class="dltitle">${planned?'Planned deload — after week 4':'Deload week'}</div>
    <div class="dlsub">${planned?'Same structure as the one you are doing now. Loads scaled to wherever week 4 finished — roughly 65% of the week 4 top sets.':'Three days. Everything should feel easy. You are offloading volume fatigue, not recovering from a deficit — this is lighter touch than the last one.'}</div>
    <table class="dltbl">
      <thead><tr><th>Day</th><th>Lift</th><th>Load</th><th>Sets</th></tr></thead>
      <tbody>
        <tr><td>Mon</td><td>Squat</td><td class="ld">${planned?'~137.5kg':'160kg'}</td><td>3 × 4</td></tr>
        <tr><td>Wed</td><td>Bench</td><td class="ld">${planned?'~102.5kg':'122.5kg'}</td><td>3 × 4</td></tr>
        <tr><td>Fri</td><td>Deadlift</td><td class="ld">${planned?'~150kg':'175kg'}</td><td>2 × 4</td></tr>
      </tbody>
    </table>
    <ul class="dllist">
      <li><strong>RPE 5–6 ceiling.</strong> Nothing should feel like work.</li>
      <li><strong>Accessories: 2 sets each, one per movement pattern.</strong> Mon leg extension + leg curl · Wed chest-supported row + incline DB press · Fri lat pulldown + back extension.</li>
      <li><strong>Cut entirely:</strong> curls, laterals, flies, rear delts, calves, skullcrushers, pushdowns, overhead press.</li>
      <li><strong>Keep eating in the surplus.</strong> Calories stay where they are — the surplus is doing the recovery work.</li>
      ${planned?'<li><strong>Then Block 3.</strong> Loads carry forward again. Length depends on how week 4 felt.</li>':'<li><strong>Then Block 2 week 1.</strong> Straight back in at 200kg squat — no need to rebuild.</li>'}
    </ul>
  </div>`;
}

function renderMain(){
  const w=WEEKS[selW];
  const el=document.getElementById('main');
  if(w.t!=='w'){el.innerHTML=deloadHTML(w.t==='dl2');return}
  const i=w.i,d=DAYS[selD],s=sess(i,selD);
  let h=`<div class="pnote${i===3?' warn':''}">${WNOTES[i]}</div>`;
  h+=`<div class="dtabs">${DAYS.map((x,j)=>`<button class="dtab${j===selD?' act':''}" onclick="sd(${j})">${x.n}</button>`).join('')}</div>`;
  h+=`<div class="scard"><div class="shead"><div class="sic" style="background:${d.bg};color:${d.tc}">${d.ic}</div><div><div class="sname">${d.n}</div><div class="ssub">${d.name} · week ${i+1}</div></div></div>`;
  const tcl={c:'tc',v:'tv',a:'ta',b:'tb',r:'tr'};
  const tlb={c:'Comp',v:'Main',a:'Accessory',b:'Physique',r:'Cuff'};
  s.forEach(e=>{
    h+=`<div class="exrow"><div class="extop"><div class="exname">${e.n}</div><div class="extags"><span class="tag ${tcl[e.t]}">${tlb[e.t]}</span><span class="rp ${rc(e.rpe)}">${e.rpe}</span></div></div>
      <div class="exdet">
        <div class="exd"><div class="exdl">Sets</div><div class="exdv">${e.s}</div></div>
        <div class="exd"><div class="exdl">Reps</div><div class="exdv">${e.rp}</div></div>
        <div class="exd"><div class="exdl">Load</div><div class="exdv${e.t==='c'||e.t==='v'?' big':''}">${e.l}</div></div>
      </div>
      <div class="exnote">${e.note}</div></div>`;
  });
  h+=`</div>`;
  el.innerHTML=h;
}

function renderNotes(){
  document.getElementById('notes').innerHTML=NOTES.map(n=>
    `<div class="ncard"><div class="nhead"><div class="nic" style="background:${n.bg};color:${n.tc}">${n.ic}</div><div class="ntitle">${n.t}</div></div><div class="nbody">${n.items.map(i=>`<div class="nitem">${i}</div>`).join('')}</div></div>`).join('');
}

function sw(i){selW=i;save();renderWeeks();renderMain()}
function sd(i){selD=i;save();renderMain()}

renderWeeks();renderMain();setView(view);
</script>
</body>
</html>
